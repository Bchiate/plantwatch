<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>PlantWatch — Guest</title>
  <meta name="description" content="Read-only view of a shared garden" />
  <meta name="theme-color" content="#0e1f15" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PlantWatch" />
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Guest-only styling. Kept here rather than in styles.css so that the
       stylesheet every existing customer loads stays byte-for-byte unchanged. -->
  <style>
    .guest-banner {
      display: flex; align-items: center; gap: 10px;
      margin: 0 0 16px; padding: 10px 14px;
      background: var(--info-bg); color: var(--ink-2);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      font-size: 13.5px; line-height: 1.45;
    }
    .guest-banner strong { color: var(--ink); font-weight: 600; }
    .guest-banner-dot {
      flex: none; width: 8px; height: 8px; border-radius: 50%;
      background: var(--info);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a7 7 0 0 0-7 7c0 3.5 2.5 6 7 13 4.5-7 7-9.5 7-13a7 7 0 0 0-7-7z"/>
              <path d="M12 11v11"/>
            </svg>
          </span>
          <h1 id="garden-title">PlantWatch</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button id="signout" class="icon-btn" aria-label="Sign out" title="Sign out">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
          <button id="refresh" class="icon-btn" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/>
            </svg>
          </button>
        </div>
      </div>
      <p id="meta" class="meta">Loading the latest readings…</p>
    </header>

    <main id="main" class="main">
      <div id="hero-card" class="hero-card hero-card--loading" aria-busy="true">
        <div class="skeleton skeleton--lg"></div>
        <div class="skeleton skeleton--md"></div>
      </div>
    </main>

    <footer class="ftr">
      <span class="ftr-meta" id="counts-meta"></span>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="guest.js"></script>
</body>
</html>
