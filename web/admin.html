<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlantWatch — Admin</title>
<style>
  :root{
    --bg:#0f1411; --panel:#171e19; --panel2:#1e2721; --line:#2c382f;
    --text:#e7efe8; --muted:#9fb0a4; --brand:#3f9d62; --brandlt:#57c07d;
    --good:#3f9d62; --dry:#d9803f; --verydry:#d7544a; --wet:#3f86d9; --unassigned:#8a63c8; --offline:#6b7a70;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--brandlt)}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(15,20,17,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px}
  header .logo .leaf{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brandlt),var(--brand));display:grid;place-items:center;color:#fff}
  header .spacer{flex:1}
  .muted{color:var(--muted)}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--brand);color:#fff;font-weight:600}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
  button:disabled{opacity:.5;cursor:default}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
  /* login */
  .login{max-width:380px;margin:9vh auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}
  .login h1{margin:0 0 4px;font-size:20px}
  .login p{margin:0 0 18px;color:var(--muted);font-size:13px}
  label{display:block;font-size:11px;letter-spacing:.5px;color:var(--muted);font-weight:600;margin:12px 0 5px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
  .login button{width:100%;margin-top:18px;padding:12px}
  .err{color:var(--verydry);font-size:13px;margin-top:12px;min-height:1em}
  /* user section */
  .usr{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:18px 0;overflow:hidden}
  .usr .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
  .usr .head h2{margin:0;font-size:17px}
  .usr .head .email{color:var(--muted);font-size:13px}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
  .pill.n{color:var(--verydry)} .pill.w{color:var(--wet)} .pill.g{color:var(--good)} .pill.u{color:var(--unassigned)} .pill.o{color:var(--offline)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:16px 18px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px;border-left:4px solid var(--offline)}
  .card.s-good{border-left-color:var(--good)} .card.s-dry{border-left-color:var(--dry)} .card.s-very_dry{border-left-color:var(--verydry)}
  .card.s-too_wet{border-left-color:var(--wet)} .card.s-unassigned{border-left-color:var(--unassigned)} .card.s-no_reading{border-left-color:var(--offline)}
  .card .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .card .nm{font-weight:600}
  .card .ch{font-size:12px;color:var(--muted)}
  .card .big{font-size:26px;font-weight:700;margin:6px 0 2px}
  .stat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:7px}
  .stat.s-good{background:rgba(63,157,98,.18);color:var(--good)} .stat.s-dry{background:rgba(217,128,63,.18);color:var(--dry)}
  .stat.s-very_dry{background:rgba(215,84,74,.2);color:var(--verydry)} .stat.s-too_wet{background:rgba(63,134,217,.18);color:var(--wet)}
  .stat.s-unassigned{background:rgba(138,99,200,.2);color:var(--unassigned)} .stat.s-no_reading{background:rgba(107,122,112,.2);color:var(--offline)}
  .card .ideal{font-size:12px;color:var(--muted);margin-top:6px}
  .card .adv{font-size:13px;margin-top:8px}
  .card .wtr{font-size:12.5px;color:var(--brandlt);margin-top:6px}
  .empty{color:var(--muted);padding:16px 18px;font-size:14px}
  /* triage */
  .triage{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:18px 0;overflow:hidden}
  .triage .thd{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .triage .thd h2{margin:0;font-size:17px}
  .trow{border-bottom:1px solid var(--line)}
  .trow>summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;gap:10px;padding:12px 18px}
  .trow>summary::-webkit-details-marker{display:none}
  .trow .tdot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--muted)}
  .trow.t-crit .tdot{background:var(--verydry)} .trow.t-warn .tdot{background:var(--dry)} .trow.t-info .tdot{background:var(--wet)}
  .trow.t-crit{border-left:3px solid var(--verydry)} .trow.t-warn{border-left:3px solid var(--dry)} .trow.t-info{border-left:3px solid var(--wet)}
  .trow .tbody{flex:1;font-size:14px}
  .trow .thead{color:var(--muted);font-size:13px}
  .trow .tmeta{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;align-self:center}
  .trow .tdetail{padding:0 18px 14px 38px;font-size:13px;color:var(--text)}
  .trow .tdetail p{margin:0 0 8px;color:var(--muted)}
  ol.fix{margin:0;padding-left:18px} ol.fix li{margin:4px 0}
  .battchip{font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CFG = {
  url: "https://your-project-ref.supabase.co",
  anon: "<supabase-anon-key>",
};
const KEY = "pw-admin-session";
const app = document.getElementById("app");
let session = JSON.parse(localStorage.getItem(KEY) || "null");

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function signIn(email, password){
  const r = await fetch(`${CFG.url}/auth/v1/token?grant_type=password`, {
    method:"POST", headers:{ apikey:CFG.anon, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password }) });
  const j = await r.json();
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || "Sign-in failed");
  session = j; localStorage.setItem(KEY, JSON.stringify(j));
}
function signOut(){ session=null; localStorage.removeItem(KEY); render(); }

async function fetchOverview(){
  const r = await fetch(`${CFG.url}/functions/v1/admin-overview`, {
    headers:{ apikey:CFG.anon, Authorization:`Bearer ${session.access_token}` } });
  if(r.status===401){ throw {code:401}; }
  if(r.status===403){ throw {code:403}; }
  if(!r.ok) throw new Error("Couldn't load overview ("+r.status+")");
  return r.json();
}

function loginView(err=""){
  app.innerHTML = `
    <div class="login">
      <h1>PlantWatch Admin</h1>
      <p>Sign in with an admin account to view every yard.</p>
      <label>EMAIL</label><input id="e" type="email" autocomplete="username" placeholder="you@example.com">
      <label>PASSWORD</label><input id="p" type="password" autocomplete="current-password" placeholder="••••••••">
      <div class="err">${esc(err)}</div>
      <button id="go">Sign in</button>
    </div>`;
  const go = document.getElementById("go");
  const submit = async () => {
    go.disabled=true; go.textContent="Signing in…";
    try{ await signIn(document.getElementById("e").value.trim(), document.getElementById("p").value); render(); }
    catch(e){ loginView(e.message); }
  };
  go.onclick = submit;
  document.getElementById("p").addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
}

function statusLabel(s){ return ({good:"Good",dry:"Dry",very_dry:"Very dry",too_wet:"Too wet",unassigned:"Set type",no_reading:"Offline"})[s]||s; }
function relTime(s){ if(!s) return "—"; const d=new Date(s), diff=(Date.now()-d)/1000;
  const u=[["yr",31536000],["mo",2592000],["d",86400],["h",3600],["m",60]];
  for(const [l,sec] of u){ if(diff>=sec) return Math.floor(diff/sec)+l+" ago"; } return "just now"; }
function shortDate(s){ if(!s) return "—"; return new Date(s).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }

function card(r){
  const m = r.moisture==null ? "—" : Math.round(r.moisture)+"%";
  const ideal = (r.ideal_low!=null&&r.ideal_high!=null) ? `ideal ${r.ideal_low}–${r.ideal_high}%` : (r.status==="unassigned"?"no type set":"");
  const battCol = r.battery_class==='critical'?'var(--verydry)':r.battery_class==='low'?'var(--dry)':'var(--muted)';
  const batt = r.battery!=null ? `<span class="battchip" style="color:${battCol}">🔋 ${r.battery}V${(r.battery_class==='low'||r.battery_class==='critical')?' '+r.battery_class:''}</span>` : "";
  const seen = (r.status==='no_reading' && r.offline_age_sec!=null) ? `last seen ${ageStr(r.offline_age_sec)} ago` : "";
  const dg = r.diagnosis;
  const fix = (dg && dg.severity!=='ok' && dg.fix_steps && dg.fix_steps.length)
    ? `<details class="trow ${sevClass(dg.severity)}" style="border:0;margin-top:8px"><summary style="padding:6px 0"><span class="tdot"></span><span class="tbody" style="font-size:13px">${esc(dg.headline)}</span></summary><div class="tdetail" style="padding:6px 0 0 18px"><p>${esc(dg.detail||"")}</p>${fixList(dg.fix_steps)}</div></details>`
    : "";
  const meta = [ideal?esc(ideal):"", batt, seen].filter(Boolean).join(" · ");
  return `<div class="card s-${r.status}">
    <div class="top"><span class="nm">${esc(r.name)}</span><span class="ch">CH${r.channel} · ${esc(r.physical_zone||r.zone||"")}</span></div>
    <div class="big">${m}</div>
    <span class="stat s-${r.status}">${statusLabel(r.status)}</span>
    ${meta?`<div class="ideal">${meta}</div>`:""}
    ${r.advice?`<div class="adv">${esc(r.advice)}</div>`:""}
    ${r.watering?`<div class="wtr">💧 ${esc(r.watering)}</div>`:""}
    ${fix}
  </div>`;
}

function userSection(u){
  const c=u.counts;
  const pills = [
    c.needs_water?`<span class="pill n">${c.needs_water} dry</span>`:"",
    c.too_wet?`<span class="pill w">${c.too_wet} wet</span>`:"",
    c.good?`<span class="pill g">${c.good} good</span>`:"",
    c.unassigned?`<span class="pill u">${c.unassigned} no type</span>`:"",
    c.offline?`<span class="pill o">${c.offline} offline</span>`:"",
  ].join("");
  const body = u.readings.length
    ? `<div class="grid">${u.readings.map(card).join("")}</div>`
    : `<div class="empty">${u.has_ecowitt?"No sensors configured yet.":"Not set up yet (no Ecowitt keys)."}</div>`;
  return `<section class="usr">
    <div class="head">
      <div><h2>${esc(u.garden_name)}${u.is_admin?' <span class="muted" style="font-size:12px">(admin)</span>':""}</h2>
      <div class="email">${esc(u.email)} · ${u.gateway_count} gateway${u.gateway_count===1?"":"s"} · ${u.readings.length} sensor${u.readings.length===1?"":"s"}</div>
      <div class="email" style="margin-top:2px">⏱ active ${relTime(u.last_sign_in_at)} · joined ${shortDate(u.created_at)}${u.onboarded?"":" · <span style='color:var(--dry)'>onboarding</span>"}</div></div>
      <div class="pills">${pills}</div>
    </div>${body}</section>`;
}

function ageStr(sec){ if(sec==null) return ""; const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60); return h>0?`${h}h ${m}m`:`${m}m`; }
function fixList(steps){ return steps&&steps.length?`<ol class="fix">${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:""; }
function sevClass(s){ return s==='critical'?'t-crit':s==='warning'?'t-warn':'t-info'; }
function triageRow(x){
  const loc = x.scope==='gateway'
    ? `${esc(x.gateway_name||'Gateway')} — ${x.sensor_count} sensors dark`
    : `${esc(x.plant||'')} · ${esc(x.zone||'')} (CH${x.channel})`;
  const meta=[];
  if(x.offline_age_sec!=null) meta.push(`offline ${ageStr(x.offline_age_sec)}`);
  if(x.battery!=null) meta.push(`${x.battery}V`);
  if(x.needs_battery) meta.push(`🔋 L91`);
  return `<details class="trow ${sevClass(x.severity)}">
    <summary>
      <span class="tdot"></span>
      <span class="tbody"><b>${esc(x.client)}</b> — ${loc}<br><span class="thead">${esc(x.headline)}</span></span>
      <span class="tmeta">${meta.map(esc).join(" · ")}</span>
    </summary>
    <div class="tdetail"><p>${esc(x.detail||"")}</p>${fixList(x.fix_steps)}</div>
  </details>`;
}
function triageSection(triage){
  if(!triage||!triage.length) return `<section class="usr"><div class="head"><h2>✅ All sensors healthy</h2><div class="email">No offline sensors, low batteries, or welfare alerts.</div></div></section>`;
  const crit=triage.filter(x=>x.severity==='critical').length, warn=triage.filter(x=>x.severity==='warning').length, info=triage.filter(x=>x.severity==='info').length;
  const pills=[crit?`<span class="pill n">${crit} critical</span>`:"", warn?`<span class="pill w" style="color:var(--dry)">${warn} warning</span>`:"", info?`<span class="pill" style="color:var(--muted)">${info} info</span>`:""].join("");
  return `<section class="triage"><div class="thd"><h2>🛠 Needs attention</h2><div class="pills">${pills}</div></div>${triage.map(triageRow).join("")}</section>`;
}

async function render(){
  if(!session){ loginView(); return; }
  app.innerHTML = `<header>
      <div class="logo"><span class="leaf">🌿</span> PlantWatch Admin</div>
      <div class="spacer"></div>
      <span id="meta" class="muted" style="font-size:13px"></span>
      <button id="refresh" class="ghost">Refresh</button>
      <button id="out" class="ghost">Sign out</button>
    </header><div class="wrap"><p class="muted">Loading every yard…</p></div>`;
  document.getElementById("out").onclick = signOut;
  document.getElementById("refresh").onclick = render;
  try{
    const data = await fetchOverview();
    const t = new Date(data.generated_at);
    document.getElementById("meta").textContent =
      `${data.user_count} account${data.user_count===1?"":"s"} · updated ${t.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`;
    const shown = data.users.filter(u => !(u.is_admin && u.readings.length === 0));
    document.querySelector(".wrap").innerHTML =
      triageSection(data.triage) +
      (shown.length ? shown.map(userSection).join("") : `<p class="muted">No customer yards yet.</p>`);
  }catch(e){
    if(e.code===401){ signOut(); return; }
    if(e.code===403){ document.querySelector(".wrap").innerHTML = `<p class="err">This account isn't an admin. Sign out and use an admin login.</p>`; return; }
    document.querySelector(".wrap").innerHTML = `<p class="err">${esc(e.message||"Error")}</p>`;
  }
}
render();
</script>
</body>
</html>
